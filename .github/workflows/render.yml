name: Render iOS 26 Unlock The Garden

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Generate procedural audio
        run: node scripts/generate-audio.mjs

      - name: TypeScript strict validation
        run: npx tsc --noEmit

      - name: List Remotion compositions
        run: npx remotion compositions src/index.ts

      - name: Render MP4 (1080x1920 @ 60 FPS)
        run: npx remotion render src/index.ts IOS26UnlockTheGarden out/ios26-unlock-the-garden.mp4 --codec=h264 --crf=18 --audio-codec=aac --audio-bitrate=192k

      - name: Upload artifact hasil-video
        uses: actions/upload-artifact@v4
        with:
          name: hasil-video
          path: out/ios26-unlock-the-garden.mp4
