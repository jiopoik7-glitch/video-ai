name: Render Video Remotion

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Ambil kode project
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate 6 file audio iOS Liquid Glass (WAV Stereo 44.1kHz)
        run: |
          node scripts/generate-audio.mjs
          ls -lh public/audio/

      - name: Verifikasi TypeScript (Zero Error)
        run: npx tsc --noEmit

      - name: Verifikasi Composition Remotion
        run: npx remotion compositions

      - name: Render Master Video MP4 (1080x1920 60fps 20s)
        run: |
          mkdir -p out
          npx remotion render src/index.ts SeflornerStroberiGlass out/seflorner-stroberi-liquid-glass-20s.mp4 --codec=h264 --crf=18 --audio-codec=aac --audio-bitrate=192k

      - name: Simpan hasil video agar bisa diunduh
        uses: actions/upload-artifact@v4
        with:
          name: hasil-video
          path: out/seflorner-stroberi-liquid-glass-20s.mp4
