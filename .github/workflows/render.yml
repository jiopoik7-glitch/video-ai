name: Render Video Remotion

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Ambil kode project
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate 7 file audio prosedural (WAV 44.1kHz Stereo)
        run: |
          node scripts/generate-audio.mjs
          ls -lh public/audio/

      - name: Verifikasi TypeScript (Zero Error)
        run: npx tsc --noEmit

      - name: Verifikasi Composition Remotion
        run: npx remotion compositions

      - name: Render 18 QA Still Frames
        run: node scripts/render-qa.mjs src/index.ts

      - name: Render Master Video MP4 (1920x1080 30fps 210s)
        run: |
          mkdir -p out
          npx remotion render src/index.ts PergerakanNasional out/sejarah-zhariif-xi2-sman2jambi.mp4 --codec=h264 --crf=18 --audio-codec=aac --audio-bitrate=192k
          ffprobe -v error -show_entries format=duration,size:stream=codec_name,width,height,r_frame_rate,sample_rate,channels -of default=noprint_wrappers=1 out/sejarah-zhariif-xi2-sman2jambi.mp4 || true

      - name: Simpan hasil video agar bisa diunduh
        uses: actions/upload-artifact@v4
        with:
          name: hasil-video
          path: out/sejarah-zhariif-xi2-sman2jambi.mp4

      - name: Simpan 18 frame QA
        uses: actions/upload-artifact@v4
        with:
          name: qa-frames
          path: out/qa/*.png
