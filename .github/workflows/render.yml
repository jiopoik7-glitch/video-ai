name: Render Video Remotion

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate procedural audio WAVs
        run: node scripts/generate-audio.mjs

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Verify Remotion compositions
        run: npx remotion compositions src/index.ts

      - name: Render master video MP4
        run: npx remotion render src/index.ts BenihTomatDataranRendah out/benih-tomat-dataran-rendah.mp4 --codec=h264 --crf=18 --audio-codec=aac --audio-bitrate=192k

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: hasil-video
          path: out/benih-tomat-dataran-rendah.mp4
          if-no-files-found: error
          compression-level: 0
