name: Render Video Remotion

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Ambil kode project
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Verifikasi TypeScript (Zero Error)
        run: npx tsc --noEmit

      - name: Verifikasi Composition Remotion
        run: npx remotion compositions

      - name: Render Master Video MP4 (1080x1080 60fps 31s)
        run: |
          mkdir -p out
          npx remotion render src/index.ts LyricEmotion out/lyric-emotion-plain.mp4 --codec=h264 --crf=16

      - name: Simpan hasil video agar bisa diunduh
        uses: actions/upload-artifact@v4
        with:
          name: hasil-video
          path: out/lyric-emotion-plain.mp4
