name: Render Remotion Lyric Video

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: TypeScript strict typecheck
        run: npx tsc --noEmit

      - name: Verify Remotion compositions
        run: npx remotion compositions

      - name: Render LyricPlain MP4
        run: npx remotion render src/index.ts LyricPlain out/lyric-plain.mp4 --codec=h264 --crf=16

      - name: Upload rendered video artifact
        uses: actions/upload-artifact@v4
        with:
          name: hasil-video
          path: out/lyric-plain.mp4
