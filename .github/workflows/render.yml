name: Render Video Remotion

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cek keberadaan video mentah (public/media/raw.mp4)
        run: |
          if [ ! -f public/media/raw.mp4 ]; then
            echo "ERROR: File public/media/raw.mp4 belum ada! Salin dulu video mentahmu ke public/media/raw.mp4 lalu git push."
            exit 1
          fi
          ls -lh public/media/raw.mp4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate tactile SFX (4 WAV files, tanpa BGM tambahan)
        run: node scripts/generate-audio.mjs

      - name: TypeScript strict typecheck
        run: npx tsc --noEmit

      - name: Verify Remotion compositions
        run: npx remotion compositions src/index.ts

      - name: Render Master Edited MP4 (1080x1920 60fps)
        run: npx remotion render src/index.ts BiviInfarmEdit out/seflorner-bivi-infarm-edited.mp4 --codec=h264 --crf=18 --audio-codec=aac --audio-bitrate=192k

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: hasil-video
          path: out/seflorner-bivi-infarm-edited.mp4
          if-no-files-found: error
          compression-level: 0
