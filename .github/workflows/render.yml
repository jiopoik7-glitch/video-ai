name: Render Video Remotion

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode project
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Render Video ke MP4
        run: npx remotion render src/index.ts HelloWorld out/video.mp4

      - name: Simpan hasil video agar bisa diunduh
        uses: actions/upload-artifact@v4
        with:
          name: hasil-video
          path: out/video.mp4
